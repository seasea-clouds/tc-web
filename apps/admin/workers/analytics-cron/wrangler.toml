name = "trade-web-admin-analytics-cron"
compatibility_date = "2026-05-23"
main = "src/index.ts"

# 纯 cron Worker，无需 HTTP 路由
workers_dev = false

[triggers]
# 每小时整点（UTC）执行一次
# 00:00 → backfill hour 23 昨天 + check daily
# 01:00 → backfill hour 00 今天 + check daily
crons = ["0 * * * *"]

[[d1_databases]]
binding = "DB"
database_id = ""
